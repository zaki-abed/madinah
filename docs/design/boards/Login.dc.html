<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تسجيل الدخول</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F7FA}
a{color:#0E7C70}a:hover{color:#0A5F56}
.en{font-family:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif;direction:ltr;unicode-bidi:isolate}
.lg{direction:rtl;font-family:'IBM Plex Sans Arabic',Tajawal,system-ui,sans-serif;color:#142B4A;background:#F5F7FA;min-height:100vh;position:relative;display:flex;flex-direction:column;align-items:center;padding:56px 20px 28px;box-sizing:border-box}
.band{position:absolute;inset:0 0 auto 0;height:300px;background:#142B4A}
.top{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;text-align:center;margin-bottom:28px}
.mark{width:64px;height:64px;border-radius:18px;background:#1C3A60;display:flex;align-items:center;justify-content:center}
.top .n{font-size:20px;line-height:30px;font-weight:700}
.top .e{font-size:12px;color:#9FB0C6;margin-top:-6px}
.box{position:relative;width:100%;max-width:420px;background:#fff;border:1px solid #E1E6EE;border-radius:20px;box-shadow:0 12px 32px rgba(20,43,74,.08);padding:32px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px}
.box h1{margin:0;font-size:24px;line-height:34px;font-weight:700}
.box .sub{margin:2px 0 0;color:#4A5A70;font-size:14px;line-height:22px}
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#142B4A}
.inp{position:relative}
.inp .ic{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:#8795A8;display:flex;pointer-events:none}
.f input{font:inherit;font-size:15px;font-weight:400;color:#142B4A;height:46px;border:1px solid #D3DAE5;border-radius:10px;padding:0 40px 0 14px;background:#fff;box-sizing:border-box;width:100%;direction:ltr;text-align:left;font-family:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif}
.f input::placeholder{color:#9FB0C6}
.f input:focus{outline:3px solid #16B8A633;outline-offset:0;border-color:#16B8A6}
.f input.bad{border-color:#D2493A}
.f input.pw{padding-left:44px}
.eye{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:8px;background:transparent;color:#4A5A70;cursor:pointer;display:flex;align-items:center;justify-content:center}
.eye:hover{background:#F5F7FA;color:#142B4A}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;color:#4A5A70;font-size:13px;font-weight:500}
.chk input{width:16px;height:16px;accent-color:#16B8A6;margin:0}
.fg{font-size:13px;font-weight:600;color:#0E7C70;background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
.fg:hover{text-decoration:underline}
.hintbox{font-size:12px;line-height:20px;color:#3A4A60;background:#F5F7FA;border-radius:10px;padding:10px 12px}
.err{display:flex;align-items:flex-start;gap:8px;background:#D2493A12;border:1px solid #F3D3CF;color:#A3291D;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;line-height:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:0 18px;border-radius:10px;font:inherit;font-size:15px;font-weight:600;border:1px solid #142B4A;background:#142B4A;color:#fff;text-decoration:none;cursor:pointer;box-sizing:border-box}
.btn:hover{background:#0B1626;color:#fff}
.sec{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#4A5A70;border-top:1px solid #EDF1F5;padding-top:14px;margin-top:2px}
.foot{position:relative;margin-top:auto;padding-top:28px;font-size:12px;color:#8795A8;text-align:center}
@media (max-width:600px){
 .lg{padding:28px 14px 20px}
 .band{height:220px}
 .top{margin-bottom:20px}
 .mark{width:52px;height:52px;border-radius:14px}
 .top .n{font-size:17px;line-height:26px}
 .box{padding:24px 18px;border-radius:16px}
}
</style>
</helmet>
<div class="lg" dir="rtl">
  <div class="band" aria-hidden="true"></div>
  <header class="top">
    <span class="mark"><svg viewBox="0 0 64 64" width="40" height="40" aria-hidden="true"><path d="M14 54 V30 A18 18 0 0 1 50 30 V54" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/><path d="M24 54 V35 A8 8 0 0 1 40 35 V54" fill="none" stroke="#16B8A6" stroke-width="7" stroke-linecap="round"/><circle cx="32" cy="12" r="4.5" fill="#F2B84B"/></svg></span>
    <div class="n">مكتب المدينة للخدمات المالية</div>
    <div class="e en">Al-Madina Financial Services</div>
  </header>

  <form class="box" aria-label="تسجيل الدخول">
    <div><h1>تسجيل الدخول</h1><p class="sub">أهلاً بك، أدخل بياناتك للمتابعة</p></div>
    <label class="f">اسم المستخدم<span class="inp"><input type="text" class="{{userCls}}" value="{{user}}" onChange="{{onUser}}" placeholder="ahmad" autocomplete="username" autocapitalize="none" spellcheck="false"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6 8-6s7.2 2 8 6"/></svg></span></span></label>
    <div class="f"><label for="pw">كلمة المرور</label><div class="inp"><input id="pw" type="{{pwType}}" class="{{passCls}}" value="{{pass}}" onChange="{{onPass}}" placeholder="••••••••" autocomplete="current-password"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><button type="button" class="eye" onClick="{{togglePw}}" aria-label="{{eyeLabel}}" title="{{eyeLabel}}"><sc-if value="{{pwHidden}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></sc-if><sc-if value="{{pwShown}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg></sc-if></button></div></div>
    <div class="row"><label class="chk"><input type="checkbox" checked="{{remember}}" onChange="{{toggleRemember}}">تذكرني على هذا الجهاز</label><button type="button" class="fg" onClick="{{toggleForgot}}">نسيت كلمة المرور؟</button></div>
    <sc-if value="{{showForgot}}" hint-placeholder-val="{{ false }}"><div class="hintbox">لاستعادة كلمة المرور تواصل مع مدير النظام، وسيعيد تعيينها لك.</div></sc-if>
    <sc-if value="{{hasErr}}" hint-placeholder-val="{{ false }}"><div class="err" role="alert"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg><span>{{err}}</span></div></sc-if>
    <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}"><a class="btn" href="Main.dc.html">تسجيل الدخول</a></sc-if>
    <sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn" onClick="{{tryLogin}}">تسجيل الدخول</button></sc-if>
    <div class="sec"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>نظام داخلي لموظفي المكتب فقط</div>
  </form>

  <footer class="foot">مكتب المدينة للخدمات المالية · <span class="en">© 2026</span></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { user: '', pass: '', show: false, remember: false, err: '', tried: false }; }
  renderVals() {
    var self = this, st = this.state, set = function (o) { self.setState(o); };
    var u = String(st.user).trim(), p = String(st.pass);
    var ready = !!u && !!p;
    return {
      user: st.user, pass: st.pass, onUser: function (e) { set({ user: e.target.value, err: '' }); }, onPass: function (e) { set({ pass: e.target.value, err: '' }); },
      userCls: st.tried && !u ? 'bad' : '', passCls: 'pw' + (st.tried && !p ? ' bad' : ''),
      pwType: st.show ? 'text' : 'password', pwHidden: !st.show, pwShown: !!st.show, eyeLabel: st.show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور',
      togglePw: function () { set({ show: !st.show }); },
      showForgot: !!st.forgot, toggleForgot: function () { set({ forgot: !st.forgot }); },
      remember: st.remember, toggleRemember: function () { set({ remember: !st.remember }); },
      hasErr: !!st.err, err: st.err, ready: ready, notReady: !ready,
      tryLogin: function () { set({ tried: true, err: !u && !p ? 'أدخل اسم المستخدم وكلمة المرور.' : !u ? 'أدخل اسم المستخدم.' : 'أدخل كلمة المرور.' }); }
    };
  }
}
</script>
</body>
</html>
