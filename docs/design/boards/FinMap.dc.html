var DOC_map = "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>الخريطة المالية — مكتب المدينة<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--navy:#142B4A;--teal:#16B8A6;--tealT:#0E7C70;--amber:#F2B84B;--bg:#F5F7FA;--line:#E1E6EE;--sub:#4A5A70;\n--okT:#136A43;--okB:#E2F4EC;--badT:#A3291D;--badB:#FBE7E5;--warnT:#7A5200;--warnB:#FDF0D5;--infoT:#1F3F66;--infoB:#E6EEF7;--neuT:#3A4A60;--neuB:#EEF1F5}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--navy);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px;line-height:1.65}\n.amt{font-family:'IBM Plex Mono',ui-monospace,monospace;direction:ltr;unicode-bidi:isolate}\n.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 64px;display:flex;flex-direction:column;gap:28px}\nheader.top{background:var(--navy);color:#fff;border-radius:22px;padding:28px 32px;display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-end}\nheader.top h1{margin:0;font-size:32px;line-height:44px}\nheader.top p{margin:4px 0 0;color:#B8C4D4}\n.legend{display:flex;flex-wrap:wrap;gap:8px}\n.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}\n.s-done{background:var(--okB);color:var(--okT)}.s-review{background:var(--warnB);color:var(--warnT)}.s-todo{background:var(--badB);color:var(--badT)}.s-later{background:var(--neuB);color:var(--neuT)}.s-q{background:var(--infoB);color:var(--infoT)}\n.dot{width:8px;height:8px;border-radius:999px;background:currentColor;display:inline-block}\nnav.toc{position:sticky;top:0;z-index:5;background:rgba(245,247,250,.94);backdrop-filter:blur(6px);padding:10px 0;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line)}\nnav.toc a{font-size:14px;font-weight:600;color:var(--neuT);text-decoration:none;padding:6px 12px;border-radius:999px}\nnav.toc a:hover{background:#fff;color:var(--navy)}\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}\n.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:2px}\n.stat b{font-size:28px;line-height:36px}\n.cap{font-size:12px;line-height:18px;color:var(--sub)}\nsection.blk{display:flex;flex-direction:column;gap:14px;scroll-margin-top:60px}\nsection.blk>h2{margin:0;font-size:24px;line-height:34px}\nsection.blk>p.lead{margin:-8px 0 0;color:var(--sub)}\n.card{background:#fff;border:1px solid var(--line);border-radius:20px}\n\n/* big picture */\n.bp{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}\n@media (max-width:980px){.bp{grid-template-columns:1fr}}\n.map{padding:20px;display:flex;flex-direction:column;gap:14px}\n.parties{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:10px;border:1px dashed #C9D2DF;border-radius:14px}\n.parties .lab{font-size:12px;font-weight:600;color:var(--sub);margin-inline-end:6px}\n.party{font-size:13px;font-weight:600;background:var(--neuB);border-radius:10px;padding:4px 10px}\n.cols{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:12px}\n@media (max-width:760px){.cols{grid-template-columns:1fr}}\n.col{border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}\n.col h3{margin:0;font-size:15px;line-height:22px;display:flex;justify-content:space-between;gap:6px;align-items:center}\n.col .sign{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600}\n.c-our{background:#EEF8F3;border:1px solid #CBE9DA}.c-vault{background:#EEF3FA;border:1px solid #CFDCEC}.c-owe{background:#FCF1F0;border:1px solid #F0D2CE}\n.box{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;transition:box-shadow .2s,border-color .2s,opacity .2s}\n.box b{font-size:14px}.box .cap{display:block}\n.box .st{position:absolute;inset-inline-start:10px;top:10px}\n.box .fx{display:none;position:absolute;inset-inline-start:-8px;top:-10px;min-width:30px;height:24px;padding:0 8px;border-radius:999px;font:600 13px/24px 'IBM Plex Mono',monospace;text-align:center;color:#fff}\n.map.sel .box{opacity:.38}\n.map.sel .box.hit{opacity:1;border-color:var(--teal);box-shadow:0 0 0 3px rgba(22,184,166,.22)}\n.map.sel .box.hit .fx{display:block}\n.fx.p{background:var(--okT)}.fx.m{background:var(--badT)}.fx.x{background:var(--infoT)}\n.eqbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px;font-weight:600}\n.eqbar .t{background:#1C3A60;border-radius:10px;padding:4px 10px}\n.eqbar .o{font-family:'IBM Plex Mono',monospace;color:var(--teal);font-size:18px}\n.below{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}\n@media (max-width:760px){.below{grid-template-columns:1fr}}\n.side{padding:16px;display:flex;flex-direction:column;gap:10px;position:sticky;top:64px}\n.side h3{margin:0;font-size:16px}\n.oplist{display:flex;flex-direction:column;gap:4px;max-height:430px;overflow:auto}\n.oplist button{font:inherit;font-size:14px;text-align:start;border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 10px;cursor:pointer;color:var(--navy);display:flex;justify-content:space-between;gap:8px;align-items:center}\n.oplist button:hover{background:var(--bg)}\n.oplist button.on{background:#DDF5F2;border-color:var(--teal);font-weight:600}\n.explain{background:var(--bg);border-radius:12px;padding:12px;font-size:14px;min-height:90px}\n.explain ul{margin:6px 0 0;padding-inline-start:18px}\n.explain li{margin:2px 0}\n\n/* filters + ops */\n.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}\n.chip{font:inherit;font-size:13px;font-weight:600;border:1px solid #D3DAE5;background:#fff;border-radius:999px;min-height:34px;padding:0 12px;cursor:pointer;color:var(--neuT)}\n.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}\n.fsep{width:1px;height:22px;background:var(--line);margin:0 4px}\n.ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}\n.op{padding:16px 18px;display:flex;flex-direction:column;gap:8px}\n.op .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}\n.op h4{margin:0;font-size:16px;line-height:24px}\n.op .grp{font-size:12px;color:var(--sub)}\n.mv{display:flex;flex-direction:column;gap:3px;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px}\n.mv span{display:flex;gap:8px}\n.mv i{font-style:normal;font-family:'IBM Plex Mono',monospace;font-weight:600;width:14px;text-align:center;flex:none}\n.op .scr{font-size:12px;color:var(--tealT);font-weight:600}\n.op .note{font-size:13px;color:var(--warnT);background:var(--warnB);border-radius:8px;padding:6px 10px}\n.op .note.q{color:var(--infoT);background:var(--infoB)}\n.op .note.t{color:var(--badT);background:var(--badB)}\n\n/* screens */\n.scr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}\n.sc{padding:12px 14px;display:flex;flex-direction:column;gap:4px}\n.sc .n{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--sub)}\n.sc b{font-size:15px}\n.sc.new{border-style:dashed}\n\n/* questions, db, next */\n.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px}\n.qq{padding:14px 16px;display:flex;flex-direction:column;gap:6px}\n.qq .about{font-size:12px;font-weight:600;color:var(--tealT)}\n.qq p{margin:0}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n@media (max-width:760px){.two{grid-template-columns:1fr}}\n.list{padding:16px 18px}\n.list h3{margin:0 0 8px;font-size:16px;display:flex;gap:8px;align-items:center}\n.list ul{margin:0;padding-inline-start:20px}\n.list li{margin:3px 0}\nol.next{margin:0;padding:16px 18px 16px 18px;padding-inline-start:38px;display:flex;flex-direction:column;gap:8px}\nol.next li b{display:block}\n.prop{font-size:11px;font-weight:600;color:var(--infoT);background:var(--infoB);border-radius:6px;padding:1px 6px;margin-inline-start:6px;vertical-align:middle}\nfooter{color:var(--sub);font-size:13px;text-align:center}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<header class=\"top\">\n <div>\n  <h1>الخريطة المالية — مكتب المدينة للخدمات المالية<\/h1>\n  <p>وين بتكون فلوس المكتب، كيف بتتحرك بكل عملية، وشو تصمّم وشو ضايل · حسب ملف التصميم لغاية 22/11/2026<\/p>\n <\/div>\n <div class=\"legend\" aria-label=\"دليل الحالات\">\n  <span class=\"pill s-done\"><span class=\"dot\"><\/span>مصمّم<\/span>\n  <span class=\"pill s-review\"><span class=\"dot\"><\/span>مصمّم · يحتاج تعديل أو تأكيد<\/span>\n  <span class=\"pill s-todo\"><span class=\"dot\"><\/span>لسا ما تصمّم<\/span>\n  <span class=\"pill s-later\"><span class=\"dot\"><\/span>المرحلة الثانية<\/span>\n <\/div>\n<\/header>\n\n<div class=\"stats\" id=\"stats\"><\/div>\n\n<nav class=\"toc\" aria-label=\"أقسام الصفحة\">\n <a href=\"#big\">الصورة الكبيرة<\/a><a href=\"#profit\">الربح ورأس المال<\/a><a href=\"#ops\">العمليات<\/a><a href=\"#screens\">الشاشات<\/a><a href=\"#questions\">أسئلة مفتوحة<\/a><a href=\"#db\">قاعدة البيانات<\/a><a href=\"#next\">الخطوات الجاية<\/a>\n<\/nav>\n\n<!-- 1. big picture -->\n<section class=\"blk\" id=\"big\">\n <h2>1. الصورة الكبيرة: وين بتكون فلوس المكتب<\/h2>\n <p class=\"lead\">كل رصيد بالمكتب موجود بواحد من هالمربعات. اختاري عملية من القائمة عشان تشوفي أي مربعات بتتحرك فيها.<\/p>\n <div class=\"bp\">\n  <div class=\"card map\" id=\"map\">\n   <div class=\"parties\"><span class=\"lab\">الأطراف اللي بنتعامل معهم:<\/span><span class=\"party\">زبون مسجّل<\/span><span class=\"party\">زبون عابر (بدون دين)<\/span><span class=\"party\">مكتب<\/span><span class=\"party\">منصة / بنك<\/span><span class=\"party\">فريق العمل<\/span><\/div>\n   <div class=\"cols\">\n    <div class=\"col c-our\">\n     <h3>ما لنا عند الغير <span class=\"sign\" style=\"color:var(--okT)\">+<\/span><\/h3>\n     <div class=\"box\" data-b=\"cust\"><b>ديون الزبائن<\/b><span class=\"cap\">بعملة اللي سلّمناه · الجنيه بيتحول دولار<\/span><span class=\"fx\"><\/span><\/div>\n     <div class=\"box\" data-b=\"offOwe\"><b>أرصدة على المكاتب (عليه)<\/b><span class=\"cap\">مثل أبو كريم – مكتب القاسم<\/span><span class=\"fx\"><\/span><\/div>\n    <\/div>\n    <div class=\"col c-vault\">\n     <h3>الخزائن: الحسابات <span class=\"cap\" style=\"font-weight:600\">لا يوجد كاش<\/span><\/h3>\n     <div class=\"box\" data-b=\"acc\"><b>حسابات المكتب حسب العملة<\/b><span class=\"cap\">USDT · ILS · USD · JOD · EGP · EUR · PayPal (خزنة مستقلة) — بنوك، محافظ، منصات، تطبيقات بطاقات<\/span><span class=\"fx\"><\/span><\/div>\n     <div class=\"box\" data-b=\"stuck\"><b>منها: رصيد متوقف بمشكلة<\/b><span class=\"cap\">تقييد / تجميد / إغلاق — الرصيد كله بيوقف<\/span><span class=\"fx\"><\/span><\/div>\n    <\/div>\n    <div class=\"col c-owe\">\n     <h3>ما علينا للغير <span class=\"sign\" style=\"color:var(--badT)\">−<\/span><\/h3>\n     <div class=\"box\" data-b=\"offHave\"><b>أرصدة المكاتب عندنا (له)<\/b><span class=\"cap\">مثل محمد أبو حامدة · بعد خصم العمولة<\/span><span class=\"fx\"><\/span><\/div>\n     <div class=\"box\" data-b=\"amanat\"><b>أمانات PayPal غير المستلمة<\/b><span class=\"cap\">بتنشأ عند إغلاق شهر PayPal<\/span><span class=\"fx\"><\/span><\/div>\n    <\/div>\n   <\/div>\n   <div class=\"eqbar\" aria-label=\"معادلة صافي رأس المال\"><span>صافي رأس المال لكل عملة<\/span><span class=\"o\">=<\/span><span class=\"t\">الخزائن<\/span><span class=\"o\">+<\/span><span class=\"t\">ما لنا<\/span><span class=\"o\">−<\/span><span class=\"t\">ما علينا<\/span><\/div>\n   <div class=\"below\">\n    <div class=\"box\" data-b=\"capital\"><b>صافي رأس المال<\/b><span class=\"cap\">«ما يملكه المكتب فعلياً» · بلوحة التحكم<\/span><span class=\"fx\"><\/span><\/div>\n    <div class=\"box\" data-b=\"profit\"><b>أرباح الشهر<\/b><span class=\"cap\">ربح USDT + الأرباح العادية بالدولار · تُسجَّل يدوياً · خارج رأس المال<\/span><span class=\"fx\"><\/span><\/div>\n    <div class=\"box\" data-b=\"exp\"><b>المصاريف<\/b><span class=\"cap\">البيت · مكافآت فريق العمل · رسوم تشغيلية — <span style=\"color:var(--badT);font-weight:600\">لسا ما تصمّمت<\/span><\/span><span class=\"fx\"><\/span><\/div>\n   <\/div>\n  <\/div>\n  <aside class=\"card side\" aria-label=\"اختيار عملية\">\n   <h3>اختاري عملية<\/h3>\n   <div class=\"oplist\" id=\"oplist\"><\/div>\n   <div class=\"explain\" id=\"explain\" aria-live=\"polite\"><span class=\"cap\">اختاري عملية من فوق، وبتظهر هون حركاتها، وبتتلوّن المربعات اللي بتتأثر: <b style=\"color:var(--okT)\">+<\/b> بيزيد، <b style=\"color:var(--badT)\">−<\/b> بينقص، <b style=\"color:var(--infoT)\">⇄<\/b> بيتحول من شكل لشكل.<\/span><\/div>\n  <\/aside>\n <\/div>\n<\/section>\n\n<!-- 2. profit -->\n<section class=\"blk\" id=\"profit\">\n <h2>2. الربح ورأس المال: كيف بينحسبوا<\/h2>\n <div class=\"two\">\n  <div class=\"card list\">\n   <h3>اللي اتفقنا عليه <span class=\"pill s-done\"><span class=\"dot\"><\/span>مقرّر<\/span><\/h3>\n   <ul>\n    <li>الربح <b>بينحسب شهرياً بمقارنة صافي رأس المال<\/b>، مش على كل حوالة.<\/li>\n    <li>بكل حوالة في خانة <b>«الربح»<\/b> اختيارية بيكتبها المدير: إذا في USDT بأي طرف ← <b>صندوق ربح USDT<\/b> بالـ USDT، وإذا ما في ← <b>الأرباح العادية<\/b> بالدولار. الحالتين للمعلومة وخارج رأس المال والخزائن.<\/li>\n    <li>الخصم بالنقل الداخلي <b>مش ربح<\/b> (هو تكلفة).<\/li>\n    <li>الخزائن = أرصدة الحسابات الآن فقط، بدون ديون ولا أمانات.<\/li>\n    <li>عملة الدين = عملة اللي سلّمناه. الاستثناء: الجنيه ← دين بالدولار بسعر صرف.<\/li>\n    <li><b>ما في شركاء، وما في إيداعات.<\/b> رأس المال بيتحدد مرة وحدة يوم ما نبلّش النظام: الأرصدة الافتتاحية + الديون والمكاتب الموجودة وقتها.<\/li>\n    <li><b>كل فلوس بتطلع برّا الحوالات = مصروف<\/b>، وأنواعها: مصروف البيت وخدماته · مكافآت فريق العمل · رسوم تشغيلية.<\/li>\n   <\/ul>\n  <\/div>\n  <div class=\"card list\">\n   <h3>اللي لسا ناقص <span class=\"pill s-todo\"><span class=\"dot\"><\/span>لسا<\/span><\/h3>\n   <ul>\n    <li><b>نتيجة الشهر<\/b><br><span style=\"font-size:14px\"><b>الربح الصافي<\/b> = رأس المال آخر الشهر − رأس المال أول الشهر<\/span><br><span style=\"font-size:14px\"><b>ربح الشغل قبل المصاريف<\/b> = الربح الصافي + مصاريف الشهر<\/span><br><span class=\"cap\">مثال: 51,500 − 50,000 = 1,500 صافي · المصاريف 500 ← الشغل جاب 2,000. وبينضاف ربح USDT من صندوقه.<\/span><\/li>\n    <li><b>شاشة المصاريف<\/b>، ومعها حساب مكافآت فريق العمل الشهري.<\/li>\n    <li><b>أرشفة الفترة<\/b>: زر موجود بصندوق الجنيه والحاسبة، بس ما في نافذة.<\/li>\n    <li>أسعار الصرف لمقارنة العملات ببعض (إذا بدنا رقم ربح واحد بالدولار).<\/li>\n   <\/ul>\n  <\/div>\n <\/div>\n<\/section>\n\n<!-- 3. operations -->\n<section class=\"blk\" id=\"ops\">\n <h2>3. العمليات: كل حركة كيف بتتم<\/h2>\n <p class=\"lead\">كل كرت: العملية، شو بيتحرك فيها، أي شاشة بتنعمل منها، وشو ضايل عليها.<\/p>\n <div class=\"filters\" id=\"opFilters\"><\/div>\n <div class=\"ops\" id=\"opsGrid\"><\/div>\n<\/section>\n\n<!-- 4. screens -->\n<section class=\"blk\" id=\"screens\">\n <h2>4. الشاشات<\/h2>\n <p class=\"lead\">الشاشات الموجودة بملف التصميم (صفحة «الواجهات الجديدة»)، والشاشات اللي لسا محتاجينها بإطار منقّط.<\/p>\n <div class=\"filters\" id=\"scFilters\"><\/div>\n <div class=\"scr-grid\" id=\"scGrid\"><\/div>\n<\/section>\n\n<!-- 5. questions -->\n<section class=\"blk\" id=\"questions\">\n <h2>5. أسئلة مفتوحة<\/h2>\n <p class=\"lead\">الأسئلة اللي بتوقف قرارات بالتصميم. اللي عليها «جديد» طلعت وأنا بعمل الخريطة، وما انسألت قبل.<\/p>\n <div class=\"qs\" id=\"qGrid\"><\/div>\n<\/section>\n\n<!-- 6. db -->\n<section class=\"blk\" id=\"db\">\n <h2>6. قاعدة البيانات<\/h2>\n <div class=\"two\">\n  <div class=\"card list\">\n   <h3><span class=\"pill s-done\"><span class=\"dot\"><\/span>مطبّق<\/span><\/h3>\n   <ul>\n    <li>الحسابات والعملات والأرصدة الافتتاحية.<\/li>\n    <li>العمليات والحركات: <span class=\"amt\">ledger_entries<\/span> بتتعبى بـ triggers، والأرصدة من views.<\/li>\n    <li>الإلغاء بدل الحذف (<span class=\"amt\">cancelled_at / by / reason<\/span>).<\/li>\n    <li>إلغاء وارد/صادر: <span class=\"amt\">movement_direction<\/span> لاتجاه الحركة فقط، و<span class=\"amt\">operation_kind<\/span> = حوالة / نقل داخلي.<\/li>\n    <li>الفترات المؤرشفة مقفلة.<\/li>\n   <\/ul>\n  <\/div>\n  <div class=\"card list\">\n   <h3><span class=\"pill s-todo\"><span class=\"dot\"><\/span>لسا مش مطبّق<\/span><\/h3>\n   <ul>\n    <li>الزبائن والديون والزبون العابر.<\/li>\n    <li>المكاتب: نشط/موقوف، سجل نسب العمولة، رابط الصفحة الخارجية، الحساب الجاري.<\/li>\n    <li>أمانات PayPal.<\/li>\n    <li>الليميت.<\/li>\n    <li>ملفات الحسابات والوثائق (بالشكل الجديد).<\/li>\n    <li>مشاكل الحسابات والمراسلات والمستندات.<\/li>\n    <li>صندوق الربح الشهري، ورأس المال الافتتاحي.<\/li>\n    <li>المصاريف وأنواعها، والمستفيد من المكافأة ونسبتها لكل حساب.<\/li>\n    <li>حالات الحساب الأربع، البطاقات والربط، كشوف PayPal، عملة الدينار JOD، وإلغاء صفقات الصناديق بسبب.<\/li>\n    <li class=\"cap\">التفاصيل الكاملة بلوحة «قواعد قاعدة البيانات» · القسم 9 (معتمدة كلها 22/11/2026). ونوع الحساب CASH بينشال: لا كاش أبداً.<\/li>\n   <\/ul>\n  <\/div>\n <\/div>\n<\/section>\n\n<!-- 7. next -->\n<section class=\"blk\" id=\"next\">\n <h2>7. الخطوات الجاية (بالترتيب المقترح)<\/h2>\n <div class=\"card\">\n  <ol class=\"next\">\n   <li><b>تصفية الشغل الصغير<\/b>رأيك بشكل «الوصل» بالصفحة الخارجية · توحيد اسم «محمد أبو حامدة» بالحوالات · فتح ملف كل زبون من القائمة.<\/li>\n   <li><b>المصاريف ومكافآت فريق العمل<\/b>البيت · المكافآت بنسبة من اللي دخل على كل حساب · الرسوم التشغيلية. ومعها إعداد «المستفيد من المكافأة» بالحساب.<\/li>\n   <li><b>نتيجة الشهر + نافذة أرشفة الفترة<\/b>المقارنة، وصندوق الربح، وقفل الفترة.<\/li>\n   <li><b>تسجيل خسارة المنصة<\/b>شكل العملية لما منصة تسكّر الحساب بدون ما ترجّع الرصيد.<\/li>\n   <li><b>إجابات أحمد<\/b>على الأسئلة بالقسم 5، وتعديل الشاشات حسبها.<\/li>\n   <li><b>تحديث قاعدة البيانات<\/b>بكل الإضافات اللي بالقسم 6.<\/li>\n   <li><b>الصلاحيات<\/b>مين بيشوف ملفات الحسابات والمشاكل وصفحات المكاتب.<\/li>\n   <li><b>المرحلة الثانية<\/b>التقارير والجرد · نسخة الموبايل.<\/li>\n  <\/ol>\n <\/div>\n<\/section>\n\n<footer>هالخريطة ملخص للتصميم، مش برمجة. الأرقام والأسماء من البيانات التجريبية بملف التصميم.<\/footer>\n<\/div>\n\n<script>\nvar ST={done:['s-done','مصمّم'],review:['s-review','يحتاج تعديل أو تأكيد'],todo:['s-todo','لسا ما تصمّم'],later:['s-later','المرحلة الثانية']};\nvar BOX={acc:'الخزائن',stuck:'الرصيد المتوقف',cust:'ديون الزبائن',offOwe:'على المكاتب',offHave:'أرصدة المكاتب (له)',amanat:'أمانات PayPal',capital:'صافي رأس المال',profit:'صندوق الربح الشهري',exp:'المصاريف'};\n/* fx: [box, sign(+,-,x), text] */\nvar OPS=[\n {id:'tr',g:'الحوالات',name:'حوالة عادية',st:'done',scr:'6. حوالة جديدة · 5. سجل الحوالات',\n  fx:[['acc','+','استلمنا من الطرف على حساب من حساباتنا'],['acc','-','سلّمنا للطرف من حساب تاني']],\n  how:'شكل واحد: «استلمنا من» و«سلّمنا إلى». الطرف ممكن يكون زبون مسجّل، أو زبون عابر (الاسم إلزامي)، أو مكتب، أو منصة. فرق السعر ما بيتسجّل ربح، وبيبيّن بمقارنة رأس المال آخر الشهر.'},\n {id:'usdt',g:'الحوالات',name:'الربح اليدوي بالحوالة',st:'done',scr:'6. حوالة جديدة · 2. لوحة التحكم',\n  fx:[['profit','+','الربح اللي كتبه المدير (اختياري)']],\n  how:'خانة واحدة «الربح». النظام بيحدد وين يروح: إذا في USDT بأي طرف ← صندوق ربح USDT (بالـ USDT)، وإلا ← الأرباح العادية (بالدولار). ما بيدخل برأس المال ولا بالخزائن، والحوالة نفسها بتنسجّل على الحسابات عادي.'},\n {id:'debt',g:'الزبائن والديون',name:'حوالة على دين (زبون مسجّل)',st:'done',scr:'6. حوالة جديدة',\n  fx:[['acc','-','سلّمنا المبلغ'],['acc','+','استلمنا جزء أو ولا إشي'],['cust','+','الباقي دين على الزبون']],\n  how:'بنكتب «المبلغ الكلي للحوالة» أول إشي. جزء: بنكتب اللي دفعه الزبون و
